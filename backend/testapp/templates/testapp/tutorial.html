<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorial — PPST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 620px;
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 32px 64px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
      min-height: 460px;
      animation: cardIn .45s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(.95) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 52px 48px 32px;
      transition: opacity .2s;
    }
    .slide-body.fading { opacity: 0; }
    .slide-icon {
      width: 80px; height: 80px;
      border-radius: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .slide-icon svg { width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .bg-blue    { background: #3b82f6; }
    .bg-indigo  { background: #4f46e5; }
    .bg-emerald { background: #10b981; }
    .bg-amber   { background: #f59e0b; }
    .slide-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 14px;
    }
    .slide-desc {
      font-size: 1rem;
      color: #64748b;
      line-height: 1.75;
      max-width: 400px;
    }
    .footer {
      background: #f8fafc;
      border-top: 1px solid #f1f5f9;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .88rem; font-weight: 600; color: #64748b;
      padding: 10px 16px; border-radius: 10px;
      background: none; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: background .15s, color .15s;
    }
    .btn-back:hover:not(:disabled) { background: #e2e8f0; color: #334155; }
    .btn-back:disabled { color: #cbd5e1; cursor: not-allowed; }
    .btn-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dots { display: flex; gap: 8px; align-items: center; }
    .dot {
      height: 6px; border-radius: 100px;
      background: #e2e8f0;
      transition: width .3s, background .3s;
      width: 6px;
    }
    .dot.active { width: 24px; background: #4f46e5; }
    .btn-next {
      display: inline-flex; align-items: center; gap: 8px;
      background: #4f46e5; color: #fff;
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: .9rem;
      padding: 12px 28px; border-radius: 14px;
      border: none; cursor: pointer;
      box-shadow: 0 4px 14px rgba(79,70,229,.3);
      transition: background .18s, transform .12s;
    }
    .btn-next:hover  { background: #4338ca; }
    .btn-next:active { transform: scale(.97); }
    .btn-next svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .tts-toggle {
      position: fixed; bottom: 20px; right: 20px;
      width: 42px; height: 42px; border-radius: 50%;
      background: #fff; border: 1.5px solid #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.12);
      color: #4f46e5; transition: background .15s, border-color .15s;
    }
    .tts-toggle:hover { background: #eef2ff; border-color: #a5b4fc; }
    .tts-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tts-toggle.muted { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="slide-body" id="slide-body">
      <div class="slide-icon" id="slide-icon">
        <svg id="slide-svg" viewBox="0 0 24 24"></svg>
      </div>
      <h2 class="slide-title" id="slide-title"></h2>
      <p class="slide-desc" id="slide-desc"></p>
    </div>
    <div class="footer">
      <button class="btn-back" id="btn-back" disabled>
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div class="dots" id="dots"></div>
      <button class="btn-next" id="btn-next">
        Next
        <svg id="chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <button class="tts-toggle" id="tts-toggle" title="Toggle audio" onclick="toggleMute()">
    <svg id="tts-icon" viewBox="0 0 24 24">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
  </button>

  <script>
    const lang = '{{ lang }}';

    const slidesEN = [
      { title: 'The Goal', desc: 'You will be presented with a sequence of items (digits or letters). Your objective is to memorize them in the exact order they appear.', bg: 'bg-blue', svg: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>' },
      { title: 'Pay Attention', desc: 'Items will appear one at a time. Watch the screen and listen carefully as the items are shown.', bg: 'bg-indigo', svg: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>' },
      { title: 'Point & Recall', desc: 'After the sequence disappears, a keypad will appear. Select the items in the same order they were shown to you, then press Submit.', bg: 'bg-emerald', svg: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>' },
      { title: 'Test Progression', desc: "You'll start with short practice sequences to get comfortable. Then the real test begins with longer sequences.", bg: 'bg-amber', svg: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>' }
    ];

    const slidesES = [
      { title: 'El Objetivo', desc: 'Se le presentará una secuencia de elementos (dígitos o letras). Su objetivo es memorizarlos en el orden exacto en que aparecen.', bg: 'bg-blue', svg: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>' },
      { title: 'Preste Atención', desc: 'Los elementos aparecerán uno a la vez. Observe la pantalla y escuche con atención mientras se muestran.', bg: 'bg-indigo', svg: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>' },
      { title: 'Señale y Recuerde', desc: 'Después de que la secuencia desaparezca, aparecerá un teclado. Seleccione los elementos en el mismo orden en que se le mostraron, luego presione Enviar.', bg: 'bg-emerald', svg: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>' },
      { title: 'Progresión de la Prueba', desc: 'Comenzará con secuencias de práctica cortas para familiarizarse. Luego comenzará la prueba real con secuencias más largas.', bg: 'bg-amber', svg: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>' }
    ];

    const slides = lang === 'es' ? slidesES : slidesEN;

    let current = 0;
    let ttsEnabled = 'speechSynthesis' in window;

    function speak(text) {
      if (!ttsEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = lang === 'es' ? 'es-US' : 'en-US';
      utt.rate = 0.92;
      window.speechSynthesis.speak(utt);
    }

    function toggleMute() {
      ttsEnabled = !ttsEnabled;
      if (!ttsEnabled) window.speechSynthesis.cancel();
      const btn  = document.getElementById('tts-toggle');
      const icon = document.getElementById('tts-icon');
      btn.classList.toggle('muted', !ttsEnabled);
      icon.innerHTML = ttsEnabled
        ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>'
        : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    }

    const slideBody  = document.getElementById('slide-body');
    const slideIcon  = document.getElementById('slide-icon');
    const slideSvg   = document.getElementById('slide-svg');
    const slideTitle = document.getElementById('slide-title');
    const slideDesc  = document.getElementById('slide-desc');
    const btnBack    = document.getElementById('btn-back');
    const btnNext    = document.getElementById('btn-next');
    const dotsEl     = document.getElementById('dots');
    const chevron    = document.getElementById('chevron');

    slides.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.id = 'dot-' + i;
      dotsEl.appendChild(d);
    });

    function render(idx, animate) {
      if (animate) {
        slideBody.classList.add('fading');
        setTimeout(() => { apply(idx); slideBody.classList.remove('fading'); }, 200);
      } else {
        apply(idx);
      }
    }

    function apply(idx) {
      const s = slides[idx];
      slideIcon.className = 'slide-icon ' + s.bg;
      slideSvg.innerHTML  = s.svg;
      slideTitle.textContent = s.title;
      slideDesc.textContent  = s.desc;
      speak(s.title + '. ' + s.desc);
      btnBack.disabled = idx === 0;
      slides.forEach((_, i) => {
        document.getElementById('dot-' + i).className = 'dot' + (i === idx ? ' active' : '');
      });
      const isLast = idx === slides.length - 1;
      btnNext.firstChild.textContent = isLast
        ? (lang === 'es' ? '¡Comenzar Práctica! ' : 'Begin Practice! ')
        : (lang === 'es' ? 'Siguiente ' : 'Next ');
      chevron.style.display = isLast ? 'none' : 'inline';
    }

    btnBack.addEventListener('click', () => { if (current > 0) render(--current, true); });
    btnNext.addEventListener('click', () => {
      if (current < slides.length - 1) {
        render(++current, true);
      } else {
        window.location.href = '/testapp/{{link}}/instructions/';
      }
    });

    window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());
    render(0, false);
  </script>
</body>
</html>
